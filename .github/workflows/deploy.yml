name: Deploy Backend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ما في داعي نرفع تاريخ الـ git نفسه عالسيرفر — وبيسبب "Permission denied"
      # على ملفات .git/objects/pack (read-only) لما يحاول السيرفر يفك الأرشيف
      - name: Remove .git before upload
        run: rm -rf .git

      # ينسخ كل ملفات الريبو (ما عدا .env / vendor / storage — مو موجودين بالريبو أصلاً) فوق السيرفر
      # بدون حذف أي شي مو موجود بالريبو (يعني .env والملفات المرفوعة تبقى زي ما هي)
      - name: Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ secrets.BACKEND_PATH }}
          overwrite: true

      # تشخيص مؤقت — نتحقق هل /home/u653666066/seles هو المسار الصحيح (فيه .env؟)
      # بدون ما نلمس سر BACKEND_PATH إطلاقاً. رح نحذف هالخطوة بعد ما نتأكد.
      - name: Diagnostic - probe candidate backend path
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- probing /home/u653666066/seles ---"
            ls -la /home/u653666066/seles 2>&1 | head -20 || echo "path not found"
            echo "--- .env there? ---"
            ls -la /home/u653666066/seles/.env 2>&1 || echo ".env not found there"
            echo "--- END PROBE ---"

      - name: Run composer install + migrate + clear caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.BACKEND_PATH }}
            unset DB_CONNECTION DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD
            composer install --no-dev --optimize-autoloader
            composer dump-autoload --no-dev --optimize
            php artisan config:clear
            php artisan cache:clear

            # تشخيص مؤقت — الـ DB لسا بترجع 'forge' رغم .env الصحيح ورغم unset فوق،
            # يعني الاحتمال الأرجح إن .env نفسه مو مقروء بسياق CLI (صلاحيات/مسار) وLaravel
            # عم يرجع لقيمة config/database.php الافتراضية المدمجة بالكود (forge/forge).
            # هاد القسم ما بيطبع كلمة السر أو أي سر — بس بيتحقق من قابلية القراءة والصلاحيات.
            echo "--- DIAGNOSTICS ---"
            whoami
            pwd
            ls -la .env
            wc -l .env
            grep -c DB_DATABASE .env || true
            php artisan config:show database.connections.mysql.host 2>&1 || true
            php artisan config:show database.connections.mysql.database 2>&1 || true
            echo "--- END DIAGNOSTICS ---"

            php artisan migrate --force
