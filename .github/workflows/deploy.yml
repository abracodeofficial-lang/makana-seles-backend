name: Deploy Backend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ما في داعي نرفع تاريخ الـ git نفسه عالسيرفر — وبيسبب "Permission denied"
      # على ملفات .git/objects/pack (read-only) لما يحاول السيرفر يفك الأرشيف
      - name: Remove .git before upload
        run: rm -rf .git

      # ينسخ كل ملفات الريبو (ما عدا .env / vendor / storage — مو موجودين بالريبو أصلاً) فوق السيرفر
      # بدون حذف أي شي مو موجود بالريبو (يعني .env والملفات المرفوعة تبقى زي ما هي)
      - name: Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ secrets.BACKEND_PATH }}
          overwrite: true

      - name: Run composer install + migrate + clear caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.BACKEND_PATH }}
            composer install --no-dev --optimize-autoloader
            composer dump-autoload --no-dev --optimize
            php artisan config:clear
            php artisan cache:clear
            php artisan migrate --force

            # الـ scheduler (تذكيرات الدوام) — منضيف سطر الـ cron مرة وحدة بس لو مش موجود
            # ما منخلي فشل هالخطوة يوقف النشر؛ لو ما زبطت منضيفه يدوياً من hPanel
            CRON_LINE="* * * * * cd ${{ secrets.BACKEND_PATH }} && $(command -v php) artisan schedule:run >> /dev/null 2>&1"
            if crontab -l 2>/dev/null | grep -qF "artisan schedule:run"; then
              echo "cron already installed"
            else
              { crontab -l 2>/dev/null || true; echo "$CRON_LINE"; } | crontab - && echo "cron installed" || echo "WARNING: could not install cron"
            fi
